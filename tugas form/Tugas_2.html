<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tugas 2</title>
</head>
<body>
    <h3>FORM REGISTRASI</h3>

    <form>
        <table>
            <tr>
                <td>NIM</td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>NAMA</td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>JENIS KELAMIN</td>
                <td>:</td>
                <td>
                    <input type="radio" name="jk"> Laki-laki
                    <input type="radio" name="jk"> Perempuan
                </td>
            </tr>
            <tr>
                <td>ASAL</td>
                <td>:</td>
                <td><label for="kota"></label>
        <select id="cars" name="kota">
            <option value="Yogyakarta">Yogyakarta</option>
            <option value="Jakarta">Jakarta</option>
            <option value="Jawa Timur">Jawa Timur</option>
                </td>
            </tr>
            <tr>
                <td>NO TELP</td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>ALAMAT EMAIL</td>
                <td>:</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>PASSWORD</td>
                <td>:</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>HOBBY</td>
                <td>:</td>
                <td>
                    <table>
                        <tr>
                            <td><input type="checkbox"> Sepakbola</td>
                            <td><input type="checkbox"> Membaca</td>
                        </tr>
                        <tr>
                            <td><input type="checkbox"> Futsal</td>
                            <td><input type="checkbox"> Jogging</td>
                        </tr>
                        <tr>
                            <td><input type="checkbox"> Berenang</td>
                            <td><input type="checkbox"> nGoWes</td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td>DESKRIPSI DIRI</td>
                <td>:</td>
                <td>
                    <textarea rows="4" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <br>
                    <input type="submit" value="OK">
                    <input type="button" value="Batal">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
